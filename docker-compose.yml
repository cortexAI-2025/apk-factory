# ─────────────────────────────────────────────────────────────────────────────
# APK Factory — full stack (single VM: 4 vCPU / 8 GB recommended)
#
# Services
#   postgres        PostgreSQL 16                    (127.0.0.1 only)
#   redis           Redis 7 — build queue            (127.0.0.1 only)
#   migrate         one-shot: prisma migrate deploy  (runs before the API starts)
#   backend         NestJS API                       (127.0.0.1:4000, exposed via Tailscale)
#   frontend        Next.js UI                       (127.0.0.1:3000, exposed via Tailscale)
#   worker          BullMQ worker; starts build containers through the Docker socket
#   apk-egress-proxy allow-list proxy: the only exit of build containers
#
# Every build runs in its own container (see worker/src/runtimes/base.runtime.ts):
#   --network apk-build-net (internal) + proxy, --cap-drop ALL, --read-only, uid 1000,
#   memory/CPU/PIDs/file-size limits, workspace quota, no secret in its environment.
#
# Nothing here is published on a public interface: keep the VM firewall closed and
# reach the services only through Tailscale (see docs/DEPLOY-VPS.md).
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend-image: &backend-image apk-factory/backend:local
x-worker-image: &worker-image apk-factory/worker:local

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: apk_factory
      POSTGRES_USER: apk_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apk_user -d apk_factory"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
    security_opt:
      - no-new-privileges:true

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
        --appendonly yes
        --maxmemory 256mb
        --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 320m }
    security_opt:
      - no-new-privileges:true

  # ─── Database migrations (one-shot) ───────────────────────────────────────
  migrate:
    image: *backend-image
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    logging: *default-logging
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://apk_user:${POSTGRES_PASSWORD}@postgres:5432/apk_factory
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    image: *backend-image
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://apk_user:${POSTGRES_PASSWORD}@postgres:5432/apk_factory
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRY: 7d
      # Public (tailnet) URLs used by the browser and by download links
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
      API_BASE_URL: ${API_BASE_URL:?set API_BASE_URL in .env}
      # Private instance: no self-registration. Accounts are created on the VM with
      # `docker compose exec backend npm run user:create -- ...`
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      WORKER_SECRET: ${WORKER_SECRET:?set WORKER_SECRET in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      UPLOADS_PATH: /app/uploads
      ENABLE_RELEASE_BUILDS: ${ENABLE_RELEASE_BUILDS:-true}
      ZIP_MAX_UPLOAD_MB: ${ZIP_MAX_UPLOAD_MB:-200}
      ZIP_MAX_EXTRACTED_MB: ${ZIP_MAX_EXTRACTED_MB:-1024}
      ZIP_MAX_FILE_MB: ${ZIP_MAX_FILE_MB:-256}
      ARTIFACT_MAX_MB: ${ARTIFACT_MAX_MB:-200}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
      RETENTION_SWEEP_MINUTES: ${RETENTION_SWEEP_MINUTES:-30}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768m }
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        # Inlined at build time: must be the public API origin seen by the browser
        NEXT_PUBLIC_API_URL: ${API_BASE_URL:?set API_BASE_URL in .env}
        NEXT_PUBLIC_WS_URL: ${API_BASE_URL:?set API_BASE_URL in .env}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384m }
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /app/.next/cache:size=256m

  # ─── Build Worker ─────────────────────────────────────────────────────────
  # Holds the Docker socket: it is the component that starts build containers.
  # Its own memory limit does NOT cover the build containers (separate cgroups).
  worker:
    image: *worker-image
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_BASE_URL: http://backend:4000
      WORKER_SECRET: ${WORKER_SECRET}
      # One build at a time on a 4 vCPU / 8 GB VM (see docs/DEPLOY-VPS.md)
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}

      # Sandbox limits for each build container
      BUILDER_IMAGE: apk-factory/android-builder:latest
      BUILD_MEMORY: ${BUILD_MEMORY:-3g}
      BUILD_CPUS: ${BUILD_CPUS:-2}
      BUILD_TIMEOUT_MS: ${BUILD_TIMEOUT_MS:-1500000}
      BUILD_MAX_WORKSPACE_MB: ${BUILD_MAX_WORKSPACE_MB:-2048}
      # Same path inside and outside the container (the daemon resolves it on the host)
      WORKSPACE_DIR: ${WORKSPACE_HOST_DIR:-/srv/apk-factory/workspaces}
      MAVEN_CACHE_DIR: ${MAVEN_CACHE_DIR:-/srv/apk-factory/maven-cache}
      BUILD_NETWORK_MODE: ${BUILD_NETWORK_MODE:-restricted}
      BUILD_NETWORK_NAME: apk-build-net
      BUILD_PROXY_URL: http://apk-egress-proxy:3128
      ENABLE_RELEASE_BUILDS: ${ENABLE_RELEASE_BUILDS:-true}
      UPLOADS_PATH: /app/uploads

      ANDROID_HOME: /opt/android-sdk
      GRADLE_CACHE_DIR: /opt/gradle-home
      USE_SECCOMP: ${USE_SECCOMP:-false}
      SECCOMP_PROFILE: /etc/apk-factory/seccomp.json

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - uploads_data:/app/uploads
      - ${WORKSPACE_HOST_DIR:-/srv/apk-factory/workspaces}:${WORKSPACE_HOST_DIR:-/srv/apk-factory/workspaces}
      - ${MAVEN_CACHE_DIR:-/srv/apk-factory/maven-cache}:${MAVEN_CACHE_DIR:-/srv/apk-factory/maven-cache}:ro

    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      apk-egress-proxy:
        condition: service_started

    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768m }

    security_opt:
      - no-new-privileges:true

  # ─── Egress allow-list proxy for sandboxed builds ─────────────────────────
  apk-egress-proxy:
    image: ubuntu/squid:latest
    container_name: apk-egress-proxy
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./docker/egress-proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./docker/egress-proxy/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
    networks:
      - default
      - build
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }
    security_opt:
      - no-new-privileges:true

  # ─── Android builder image (run once, see scripts/vps/install.sh) ─────────
  android-builder-init:
    build:
      context: .
      dockerfile: docker/android-builder/Dockerfile
    image: apk-factory/android-builder:latest
    entrypoint: ["/bin/bash", "-c", "java -version 2>&1 | head -1 && ls /opt/android-sdk/platforms/"]
    profiles:
      - init

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  # Internal: containers on it have no route to the internet or the host
  build:
    name: apk-build-net
    internal: true
  default:
    name: apk-factory-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
