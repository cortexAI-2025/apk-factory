version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# APK Factory — Full Stack
#
# Services:
#   postgres      PostgreSQL 16
#   redis         Redis 7 (queue + cache)
#   backend       NestJS API (port 4000)
#   frontend      Next.js UI (port 3000)
#   worker        BullMQ build worker (talks to Docker socket)
#
# Each build runs in its own isolated Docker container spawned by the worker:
#   docker run --rm --memory=3g --cpus=2 --network=none --read-only ...
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: apk_factory
      POSTGRES_USER: apk_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"     # Bind to loopback only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apk_user -d apk_factory"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:?err}
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"     # Bind to loopback only
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://apk_user:${POSTGRES_PASSWORD}@postgres:5432/apk_factory
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?err}
      JWT_EXPIRY: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      WORKER_SECRET: ${WORKER_SECRET:?err}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      UPLOADS_PATH: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m

  # ─── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_BASE_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${API_BASE_URL:-http://localhost:4000}
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m
      - /app/.next/cache:size=512m

  # ─── Build Worker ─────────────────────────────────────────────────────────
  # The worker spawns Docker containers for each build — it needs
  # access to the Docker socket and the uploads volume.
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_BASE_URL: http://backend:4000
      WORKER_SECRET: ${WORKER_SECRET}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Sandbox configuration passed to DockerRunner
      BUILDER_IMAGE: apk-factory/android-builder:latest
      BUILD_MEMORY: ${BUILD_MEMORY:-3g}
      BUILD_CPUS: ${BUILD_CPUS:-2}
      BUILD_TIMEOUT_MS: ${BUILD_TIMEOUT_MS:-1500000}
      WORKSPACE_DIR: /tmp/apk-factory/workspaces
      UPLOADS_PATH: /app/uploads

      # Read-only bind mounts inside build containers
      ANDROID_HOME: /opt/android-sdk
      GRADLE_CACHE_DIR: /opt/gradle-home

      # Seccomp (set to 'true' and mount the profile)
      USE_SECCOMP: ${USE_SECCOMP:-false}
      SECCOMP_PROFILE: /etc/apk-factory/seccomp.json

    volumes:
      # Docker socket — required to spawn build containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Shared uploads (APKs written here)
      - uploads_data:/app/uploads
      # Workspace: host bind-mount so spawned build containers can access the
      # same path via Docker daemon (Docker volumes are not visible to DinD).
      - /tmp/apk-factory/workspaces:/tmp/apk-factory/workspaces

    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

    deploy:
      resources:
        limits:
          cpus: '${WORKER_HOST_CPUS:-4}'
          memory: '${WORKER_HOST_MEMORY:-8G}'

    security_opt:
      - no-new-privileges:true

  # ─── Android builder image (run once before first build) ──────────────────
  # Builds the Docker image used for all sandboxed APK builds.
  # The SDK and Gradle wrapper ZIPs are baked directly into this image.
  # Run:  docker-compose run --rm android-builder-init
  android-builder-init:
    build:
      context: .
      dockerfile: docker/android-builder/Dockerfile
    image: apk-factory/android-builder:latest
    entrypoint: ["/bin/bash", "-c", "echo '✓ android-builder image ready' && java -version 2>&1 && echo 'SDK:' && ls /opt/android-sdk/platforms/ 2>/dev/null || echo 'SDK not found'"]
    profiles:
      - init

  # ─── Queue monitor (optional) ─────────────────────────────────────────────
  bull-board:
    image: ghcr.io/felixmosh/bull-board:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    profiles:
      - monitoring
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  default:
    name: apk-factory-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
