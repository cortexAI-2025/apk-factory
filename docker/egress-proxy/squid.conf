# APK Factory — egress allow-list for sandboxed Android builds.
# Build containers live on an internal Docker network with no route to the
# internet; this proxy is their only way out, and only to the hosts below.

http_port 3128
visible_hostname apk-egress-proxy
pid_filename /var/run/squid.pid
cache deny all
forwarded_for delete

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Allowed destinations (extend via docker/egress-proxy/allowed-domains.txt)
acl build_hosts dstdomain "/etc/squid/allowed-domains.txt"

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow build_hosts
http_access deny all
