name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npx tsc --noEmit -p .
          npm test
      - name: Worker
        working-directory: worker
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit -p .
          npm run build
      - name: Scripts
        run: |
          node --check scripts/isolation-check.mjs
          for f in e2e/*.cjs; do node --check "$f"; done
          bash -n docker/android-builder/entrypoint.sh e2e/verify-apk.sh e2e/emulator-check.sh scripts/egress-proxy-up.sh

  e2e:
    name: ZIP to debug APK (real build, isolation, emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write   # push test evidence to the ci-evidence branch
    env:
      E2E_OUT: ${{ github.workspace }}/e2e-out
      UPLOADS_PATH: ${{ runner.temp }}/uploads
      WORKSPACE_DIR: /tmp/apk-factory/workspaces
      DATABASE_URL: postgresql://apk_user:ci_pg_password@localhost:5432/apk_factory
      REDIS_PASSWORD: ci_redis_password
      JWT_SECRET: ci-jwt-secret-value-0123456789
      WORKER_SECRET: ci-worker-secret-value-0123456789
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apk_factory
          POSTGRES_USER: apk_user
          POSTGRES_PASSWORD: ci_pg_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apk_user -d apk_factory" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "::warning::/dev/kvm not available"

      - name: Redis
        run: docker run -d --name ci-redis -p 6379:6379 redis:7-alpine redis-server --requirepass "$REDIS_PASSWORD"

      - uses: docker/setup-buildx-action@v3
      - name: Build the Android builder image (SDK 34, JDK 17)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/android-builder/Dockerfile
          tags: apk-factory/android-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Egress allow-list proxy + internal build network
        run: bash scripts/egress-proxy-up.sh

      - name: Install, migrate and build the stack
        run: |
          (cd backend && npm ci --no-audit --no-fund && npx prisma generate && npx prisma migrate deploy && npm run build)
          (cd worker && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          (cd e2e && npm install --no-audit --no-fund && npx playwright install --with-deps chromium)
          mkdir -p "$UPLOADS_PATH" "$E2E_OUT" "$WORKSPACE_DIR" && chmod 1777 "$WORKSPACE_DIR"

      - name: Start backend, worker and web UI
        run: |
          export NODE_ENV=production PORT=4000 REDIS_HOST=localhost REDIS_PORT=6379
          export API_BASE_URL=http://localhost:4000 FRONTEND_URL=http://localhost:3000
          (cd backend && nohup node dist/main > "$E2E_OUT/backend.log" 2>&1 &)
          (cd worker && BUILD_NETWORK_MODE=restricted BUILD_PROXY_URL=http://apk-egress-proxy:3128 RUNTIME=docker nohup node dist/index.js > "$E2E_OUT/worker.log" 2>&1 &)
          (cd frontend && nohup npx next start -p 3000 > "$E2E_OUT/web.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:4000/api/v1/health >/dev/null && curl -sf localhost:3000/auth/login >/dev/null && exit 0; sleep 2; done
          echo "::error::stack did not start"; tail -n 40 "$E2E_OUT"/*.log; exit 1

      - name: Worker isolation checks (exact production sandbox flags)
        run: BUILD_PROXY_URL=http://apk-egress-proxy:3128 node scripts/isolation-check.mjs --expect-allowed-200 | tee "$E2E_OUT/isolation.txt"

      - name: UI flow — import reference ZIP, build, download
        working-directory: e2e
        env:
          E2E_FORBIDDEN: ${{ env.WORKER_SECRET }},${{ env.REDIS_PASSWORD }},${{ env.JWT_SECRET }}
        run: node ui-flow.cjs | tee "$E2E_OUT/ui.txt"

      - name: Verify the downloaded APK signature and manifest
        run: bash e2e/verify-apk.sh "$E2E_OUT/app-debug.apk" | tee "$E2E_OUT/apk-verify.txt"

      - name: API checks — invalid ZIPs, Gradle diagnostics, owner-only access
        working-directory: e2e
        env:
          E2E_FORBIDDEN: ${{ env.WORKER_SECRET }},${{ env.REDIS_PASSWORD }},${{ env.JWT_SECRET }}
        run: node api-checks.cjs | tee "$E2E_OUT/api.txt"

      - name: Install and launch on an Android emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash e2e/emulator-check.sh e2e-out/app-debug.apk e2e-out

      - name: Summary
        if: always()
        run: |
          {
            echo "## ZIP → debug APK end-to-end"
            echo "Commit: \`${GITHUB_SHA}\`"
            for f in isolation ui apk-verify api; do
              [ -f "$E2E_OUT/$f.txt" ] && { echo "### $f"; echo '```'; tail -n 40 "$E2E_OUT/$f.txt"; echo '```'; }
            done
            [ -f "$E2E_OUT/ui-report.json" ] && python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open(os.environ["E2E_OUT"] + "/ui-report.json"))
          print(f"APK: **{r['fileName']}** — {r['size']} bytes — SHA-256 `{r['sha256']}`")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence (APK, screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            e2e-out/
            !e2e-out/fixture-*.zip
            !e2e-out/bomb.zip
            !e2e-out/ui-report.json
          retention-days: 30

      - name: Publish evidence to the ci-evidence branch
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          RUN_DIR="runs/${GITHUB_SHA::7}-${GITHUB_RUN_ID}"
          rm -rf /tmp/ev && git clone --depth 1 --branch ci-evidence "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/ev 2>/dev/null \
            || { mkdir /tmp/ev && cd /tmp/ev && git init -q -b ci-evidence && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; }
          cd /tmp/ev && mkdir -p "$RUN_DIR"
          rsync -a --exclude 'fixture-*.zip' --exclude 'bomb.zip' --exclude 'ui-report.json' --exclude '*.log' "$E2E_OUT"/ "$RUN_DIR"/
          for l in backend worker; do [ -f "$E2E_OUT/$l.log" ] && sed -E 's#(secret|password|token)[=:][^ ]+#\1=***#Ig' "$E2E_OUT/$l.log" | tail -n 400 > "$RUN_DIR/$l.log"; done
          echo "{\"sha\":\"${GITHUB_SHA}\",\"run\":\"${GITHUB_RUN_ID}\",\"ref\":\"${GITHUB_REF_NAME}\",\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" > "$RUN_DIR/meta.json"
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "CI evidence for ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})" && git push -q origin HEAD:ci-evidence || echo "::warning::could not push evidence"
